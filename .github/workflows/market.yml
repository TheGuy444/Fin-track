name: Update market prices

on:
  schedule:
    # Weekdays: US mid-morning, early afternoon, and after the close (times are UTC).
    - cron: '23 14,17,21 * * 1-5'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        run: node scripts/update-market.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- market.json)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -m "Update market prices"
          git push
